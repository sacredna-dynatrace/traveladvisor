---
apiVersion: v1
kind: Namespace
metadata:
  name: travel-advisor
  labels:
    name: travel-advisor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-advisor
  namespace: travel-advisor
spec:
  selector:
    matchLabels:
      name: travel-advisor
  template:
    metadata:
      labels:
        name: travel-advisor
    spec:
      containers:
        - name: travel-advisor
          # Built locally from this repo and loaded into kind by .devcontainer/deployment.sh
          image: travel-advisor:local
          imagePullPolicy: Never
          env:
            # ── Kubernetes metadata → OTel resource attributes ─────────────────────────
            # Dynatrace가 OTel service를 Smartscape의 K8s cluster/namespace/workload/pod에
            # 연결하려면 span/metric/log resource에 k8s.* 속성이 있어야 한다.
            # (Traceloop은 Resource.create()를 쓰므로 OTEL_RESOURCE_ATTRIBUTES가 그대로 합쳐진다)
            # k8s.cluster.uid = kube-system namespace UID. deployment.sh가 ConfigMap k8s-cluster-info로 만든다.
            - name: K8S_CLUSTER_UID
              valueFrom:
                configMapKeyRef:
                  name: k8s-cluster-info
                  key: cluster-uid
            - name: K8S_CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: k8s-cluster-info
                  key: cluster-name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # workload / container 이름은 downward API로 얻을 수 없어 정적 값으로 지정
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: >-
                k8s.cluster.uid=$(K8S_CLUSTER_UID),k8s.cluster.name=$(K8S_CLUSTER_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.pod.name=$(K8S_POD_NAME),k8s.pod.uid=$(K8S_POD_UID),k8s.node.name=$(K8S_NODE_NAME),k8s.workload.kind=deployment,k8s.workload.name=travel-advisor,k8s.deployment.name=travel-advisor,k8s.container.name=travel-advisor
            - name: AWS_DEFAULT_REGION
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: region
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: secret
            - name: AWS_EMBEDDING_MODEL
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: embedding
            - name: AWS_MODEL
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: model
            - name: AWS_GUARDRAIL_ID
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: guardrail
            - name: AWS_GUARDRAIL_VERSION
              valueFrom:
                secretKeyRef:
                  name: bedrock
                  key: guardrail-version
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: secrets
              readOnly: true
              mountPath: "/etc/secrets"
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: dynatrace
              - secret:
                  name: bedrock
              # provider / anthropic-key / anthropic-model (LLM_PROVIDER=anthropic)
              - secret:
                  name: llm
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: travel-advisor
  namespace: travel-advisor
spec:
  type: NodePort
  selector:
    name: travel-advisor
  ports:
    - port: 80
      name: http
      targetPort: 8080
      protocol: TCP
      nodePort: 30100
